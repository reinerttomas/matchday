# Only what follows from this file's services and volumes. Everything else comes from .env, because `environment` would override it.
x-app-environment: &app-environment
    AUTORUN_ENABLED: 'false'
    DB_CONNECTION: sqlite
    DB_DATABASE: /var/www/html/database/sqlite/database.sqlite
    # Octane workers, the queue and the scheduler write to the same SQLite file at once.
    DB_JOURNAL_MODE: wal
    INERTIA_SSR_URL: http://ssr:13714
    NIGHTWATCH_INGEST_URI: nightwatch-agent:2407

# The release workflow builds and pushes the image, so Dokploy only pulls it.
x-app: &app
    image: ghcr.io/reinerttomas/matchday:${IMAGE_TAG:?IMAGE_TAG must be set in .env}
    restart: unless-stopped
    env_file:
        - .env
    environment:
        <<: *app-environment
    volumes:
        - sqlite:/var/www/html/database/sqlite
        - storage_private:/var/www/html/storage/app/private
        - storage_public:/var/www/html/storage/app/public

services:
    app:
        <<: *app
        environment:
            <<: *app-environment
            # Migrations, optimize and storage:link run here on start, before Octane boots.
            AUTORUN_ENABLED: 'true'
        depends_on:
            ssr:
                condition: service_started
        healthcheck:
            test: ['CMD', 'healthcheck-octane']
            start_period: 10s

    queue:
        <<: *app
        command: ['php', '/var/www/html/artisan', 'queue:work', '--tries=3']
        stop_signal: SIGTERM
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'healthcheck-queue']
            start_period: 10s

    scheduler:
        <<: *app
        command: ['php', '/var/www/html/artisan', 'schedule:work']
        stop_signal: SIGTERM
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'healthcheck-schedule']
            start_period: 10s

    ssr:
        <<: *app
        command: ['php', '/var/www/html/artisan', 'inertia:start-ssr']
        stop_signal: SIGTERM
        environment:
            <<: *app-environment
            INERTIA_SSR_URL: http://127.0.0.1:13714
            # Keeps the inertia:check-ssr healthcheck out of Nightwatch.
            NIGHTWATCH_ENABLED: 'false'
        volumes: []
        healthcheck:
            test: ['CMD', 'php', '/var/www/html/artisan', 'inertia:check-ssr']
            start_period: 10s

    nightwatch-agent:
        image: laravelphp/nightwatch-agent:v1
        restart: unless-stopped
        # Only the token, so the third-party image never sees the app's other secrets.
        environment:
            NIGHTWATCH_TOKEN: ${NIGHTWATCH_TOKEN}
        healthcheck:
            test: ['CMD', 'php', 'nightwatch-status']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s

volumes:
    sqlite:
    storage_private:
    storage_public:
