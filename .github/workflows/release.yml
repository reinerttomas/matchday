name: release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  # Tags pushed with GITHUB_TOKEN do not trigger other workflows, so every job
  # that must run for a new release belongs in this workflow behind these outputs.
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  ci:
    needs: release
    if: needs.release.outputs.release_created == 'true'

    permissions:
      contents: read

    uses: ./.github/workflows/tests.yml

  image:
    needs:
      - release
      - ci
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Provenance attestations turn the push into an image index, and GHCR
          # reads the source repository from the index.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/reinerttomas/matchday
          # The semver tag also adds `latest` (flavor latest=auto) and, having the
          # highest priority, becomes the version output.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag_name }}
            type=sha

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: deploy
          platforms: linux/amd64
          # Vite inlines the app name into the bundle at build time, so Dokploy's
          # .env cannot set it.
          build-args: |
            VITE_APP_NAME=Matchday
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write job summary
        env:
          TAG_NAMES: ${{ steps.meta.outputs.tag-names }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Pushed `ghcr.io/reinerttomas/matchday`'
            echo
            while read -r tag_name; do
              echo "- \`${tag_name}\`"
            done <<< "$TAG_NAMES"
            echo
            echo "Digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs:
      - release
      - image
    if: needs.release.outputs.release_created == 'true'

    permissions:
      contents: read
      packages: read

    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.image.outputs.version }}
    # Passed by name rather than inherited, so the deploy gets only these.
    secrets:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
