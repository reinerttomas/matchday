name: release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  # Tags pushed with GITHUB_TOKEN do not trigger other workflows, so every job
  # that must run for a new release belongs in this workflow behind these outputs.
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
